<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Stealth Obsidian & Charcoal Base -->
    <linearGradient id="canary-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="canary-slate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="canary-slate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Radiant Canary Gold / Amber (The Canary Deployment Stream) -->
    <linearGradient id="canary-gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="canary-gold-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="canary-amber-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Electric Cyan Telemetry & Supervisor (Stable Mesh Stream) -->
    <linearGradient id="canary-cyan-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="canary-cyan-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Volumetric Shadow -->
    <filter id="shadow-profile" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#080c14" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512) scale(1.08) translate(-512, -512)" filter="url(#shadow-profile)">

      <!-- Subtle Mesh Routing Vector in Background -->
      <g stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6,8" opacity="0.65">
        <line x1="180" y1="650" x2="820" y2="330" />
      </g>
      <circle cx="180" cy="650" r="5.5" fill="#00f5ff" />
      <circle cx="820" cy="330" r="5.5" fill="#fbbf24" />

      <!-- ================= 12 MASTERPIECE ORIGAMI FACETS ================= -->

      <!-- 1. Upper Alert Crest Plume (The Canary's Defining Crown) -->
      <polygon points="390,220 540,210 490,320 350,290" fill="url(#canary-gold-bright)" />
      <polygon points="490,210 580,180 540,210" fill="#fef08a" />

      <!-- 2. Forehead Diamond Facet (Radiant Amber Fold) -->
      <polygon points="540,210 680,290 590,370 490,320" fill="url(#canary-gold-shadow)" />

      <!-- 3. Sharp Conical Canary Beak (Avian Seed-eater Beak in Glowing Gold) -->
      <!-- Upper Mandible -->
      <polygon points="680,290 820,350 740,390 640,360" fill="url(#canary-gold-bright)" />
      <!-- Lower Mandible Undertomb -->
      <polygon points="740,390 820,350 750,420 670,395" fill="url(#canary-amber-deep)" />

      <!-- 4. Ocular Brow Shield (Deep Midnight Slate) -->
      <polygon points="590,370 680,290 640,360 670,395 570,425" fill="url(#canary-obsidian)" />

      <!-- 5. Canary Telemetry Eye (SLA Sentinel / Latency-Anomaly Node) -->
      <polygon points="605,355 648,368 628,394 588,381" fill="#ffffff" />
      <polygon points="610,358 644,370 625,390 594,379" fill="#00f5ff" />
      <circle cx="620" cy="375" r="4" fill="#080c14" />
      <circle cx="622" cy="373" r="1.5" fill="#ffffff" />

      <!-- 6. Cheek & Throat Keel (Pure Ice White Plane - High Contrast Signature) -->
      <polygon points="490,320 590,370 570,425 510,510 410,430" fill="#ffffff" />

      <!-- 7. Throat Forward Shield (Vivid Canary Amber - Seamlessly Connected Chin) -->
      <polygon points="570,425 670,395 750,420 700,480 640,530 570,530 510,510" fill="url(#canary-gold-bright)" />
      <polygon points="670,395 750,420 700,480" fill="url(#canary-gold-shadow)" />

      <!-- 8. Rear Nape Armor (Obsidian Slate Mid) -->
      <polygon points="260,340 350,290 410,430 310,490" fill="url(#canary-slate-dark)" />

      <!-- 9. Primary Wing Blade - Canary Stream (Radiant Canary Gold Flight Vector) -->
      <polygon points="410,430 510,510 570,530 640,530 580,630 460,620 400,570 310,490" fill="url(#canary-gold-shadow)" />

      <!-- 10. Secondary Wing Blade - Stable Traffic Stream (Electric Cyan Flow) -->
      <polygon points="310,490 400,570 460,620 580,630 510,720 380,670 240,580" fill="url(#canary-cyan-bright)" />

      <!-- 11. Trailing Wing Blade - Compensation / Rollback Guard (Midnight Navy) -->
      <polygon points="240,580 380,670 510,720 440,800 310,750 190,650" fill="url(#canary-obsidian)" />

      <!-- 12. Wing Apex Golden Quill (Canary Amber Accent) -->
      <polygon points="510,720 580,630 610,700 530,780" fill="url(#canary-gold-bright)" />

      <!-- Lower Body Spine & Covert Feather (Amber Accent) -->
      <polygon points="190,650 310,750 270,830 190,750" fill="url(#canary-slate-dark)" />

      <!-- Central Proxy Supervisor Core Jewel (Heart Keel Node) -->
      <circle cx="490" cy="470" r="15" fill="#080c14" />
      <circle cx="490" cy="470" r="10" fill="url(#canary-cyan-bright)" />
      <circle cx="490" cy="470" r="4.5" fill="#ffffff" />

    </g>
  </g>
</svg>